global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "sentra-services"
    static_configs:
      - targets:
          - "host.docker.internal:8000"
          - "host.docker.internal:8001"
          - "host.docker.internal:8002"
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
