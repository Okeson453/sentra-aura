openapi: 3.1.0
info:
  title: Event Schema Registry
  version: 1.0.0
  description: Event schema versioning, validation, compatibility checking, schema evolution
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: readinessCheck
      summary: Readiness check
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /schemas:
    get:
      operationId: listSchemas
      summary: List all registered schemas
      security:
        - bearerAuth: []
      parameters:
        - name: event_type
          in: query
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Schema list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventSchema"
    post:
      operationId: registerSchema
      summary: Register a new event schema
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventSchema"
      responses:
        "201":
          description: Schema registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSchema"
        "409":
          description: Schema already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /schemas/{event_type}/{version}:
    get:
      operationId: getSchema
      summary: Get schema by event type and version
      security:
        - bearerAuth: []
      parameters:
        - name: event_type
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Schema details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSchema"
        "404":
          description: Schema not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSchema
      summary: Delete a schema version
      security:
        - bearerAuth: []
      parameters:
        - name: event_type
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Schema deleted
  /schemas/{event_type}/{version}/validate:
    post:
      operationId: validateEvent
      summary: Validate an event against a schema
      security:
        - bearerAuth: []
      parameters:
        - name: event_type
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
  /schemas/{event_type}/compatibility:
    post:
      operationId: checkCompatibility
      summary: Check backward compatibility between schema versions
      security:
        - bearerAuth: []
      parameters:
        - name: event_type
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from_version:
                  type: string
                to_version:
                  type: string
      responses:
        "200":
          description: Compatibility result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompatibilityResult"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, degraded]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [pass, fail, warn]
              latency_ms:
                type: number
    ErrorResponse:
      type: object
      required: [error_code, message, trace_id]
      properties:
        error_code:
          type: string
        message:
          type: string
        trace_id:
          type: string
        details:
          type: object
    EventSchema:
      type: object
      required: [event_type, version, schema_definition]
      properties:
        event_type:
          type: string
        version:
          type: string
        schema_definition:
          type: object
        description:
          type: string
        owner:
          type: string
        created_at:
          type: string
          format: date-time
        deprecated:
          type: boolean
        deprecation_reason:
          type: string
    ValidationResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              severity:
                type: string
                enum: [error, warning]
    CompatibilityResult:
      type: object
      required: [compatible]
      properties:
        compatible:
          type: boolean
        level:
          type: string
          enum: [backward, forward, full, none]
        breaking_changes:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              change_type:
                type: string
              description:
                type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
