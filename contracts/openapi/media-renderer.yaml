openapi: 3.1.0
info:
  title: Media Renderer
  version: 1.0.0
  description: GPU-accelerated video composition, rendering pipeline, format transcoding
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: readinessCheck
      summary: Readiness check
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /render:
    post:
      operationId: submitRenderJob
      summary: Submit a render job
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderJobRequest"
      responses:
        "202":
          description: Render job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJob"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /render/jobs/{job_id}:
    get:
      operationId: getRenderJob
      summary: Get render job status
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Render job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJob"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /render/jobs/{job_id}/cancel:
    post:
      operationId: cancelRenderJob
      summary: Cancel a render job
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job cancelled
  /render/jobs:
    get:
      operationId: listRenderJobs
      summary: List render jobs
      security:
        - bearerAuth: []
      parameters:
        - name: channel_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, rendering, completed, failed, cancelled]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Render job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RenderJob"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
  /transcode:
    post:
      operationId: submitTranscodeJob
      summary: Submit a transcode job
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscodeRequest"
      responses:
        "202":
          description: Transcode job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJob"
  /templates:
    get:
      operationId: listTemplates
      summary: List available render templates
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RenderTemplate"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, degraded]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [pass, fail, warn]
              latency_ms:
                type: number
    ErrorResponse:
      type: object
      required: [error_code, message, trace_id]
      properties:
        error_code:
          type: string
        message:
          type: string
        trace_id:
          type: string
        details:
          type: object
    Pagination:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    RenderJobRequest:
      type: object
      required: [project_id, composition]
      properties:
        project_id:
          type: string
        channel_id:
          type: string
        composition:
          type: object
          properties:
            scenes:
              type: array
              items:
                type: object
            transitions:
              type: array
              items:
                type: object
            audio_track:
              type: object
            overlay_elements:
              type: array
              items:
                type: object
        output_format:
          type: string
          enum: [mp4, mov, webm, prores]
          default: mp4
        resolution:
          type: string
          enum: [4k, 1080p, 720p, 480p]
          default: 1080p
        frame_rate:
          type: integer
          enum: [24, 30, 60]
          default: 30
        priority:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
    RenderJob:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, rendering, completed, failed, cancelled]
        project_id:
          type: string
        channel_id:
          type: string
        progress_percent:
          type: integer
        output_url:
          type: string
        output_format:
          type: string
        resolution:
          type: string
        duration_seconds:
          type: number
        file_size_bytes:
          type: integer
        gpu_node_id:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        error_message:
          type: string
    TranscodeRequest:
      type: object
      required: [source_asset_id, target_format]
      properties:
        source_asset_id:
          type: string
        target_format:
          type: string
          enum: [mp4, mov, webm, gif, mp3, wav]
        target_resolution:
          type: string
        target_bitrate:
          type: string
        preserve_quality:
          type: boolean
          default: true
    RenderTemplate:
      type: object
      required: [template_id, name]
      properties:
        template_id:
          type: string
        name:
          type: string
        description:
          type: string
        compatible_formats:
          type: array
          items:
            type: string
        default_settings:
          type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
