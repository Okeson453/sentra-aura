openapi: 3.1.0
info:
  title: Publishing Service
  version: 1.0.0
  description: Multi-platform publishing, scheduling, metadata optimization, post analytics
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: readinessCheck
      summary: Readiness check
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /publications:
    post:
      operationId: createPublication
      summary: Create a publication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationCreate"
      responses:
        "201":
          description: Publication created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
    get:
      operationId: listPublications
      summary: List publications
      security:
        - bearerAuth: []
      parameters:
        - name: channel_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, scheduled, publishing, published, failed, archived]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Publication list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Publication"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
  /publications/{publication_id}:
    get:
      operationId: getPublication
      summary: Get publication by ID
      security:
        - bearerAuth: []
      parameters:
        - name: publication_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Publication details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
    put:
      operationId: updatePublication
      summary: Update publication
      security:
        - bearerAuth: []
      parameters:
        - name: publication_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationUpdate"
      responses:
        "200":
          description: Publication updated
    delete:
      operationId: deletePublication
      summary: Delete/archive publication
      security:
        - bearerAuth: []
      parameters:
        - name: publication_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Publication deleted
  /publications/{publication_id}/publish:
    post:
      operationId: publishNow
      summary: Publish immediately
      security:
        - bearerAuth: []
      parameters:
        - name: publication_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Publish initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishJob"
  /publications/{publication_id}/schedule:
    post:
      operationId: schedulePublication
      summary: Schedule publication
      security:
        - bearerAuth: []
      parameters:
        - name: publication_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_at]
              properties:
                scheduled_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Publication scheduled
  /publications/{publication_id}/unpublish:
    post:
      operationId: unpublish
      summary: Unpublish from platforms
      security:
        - bearerAuth: []
      parameters:
        - name: publication_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Publication unpublished
  /platforms:
    get:
      operationId: listPlatforms
      summary: List connected publishing platforms
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Platform list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Platform"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, degraded]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [pass, fail, warn]
              latency_ms:
                type: number
    ErrorResponse:
      type: object
      required: [error_code, message, trace_id]
      properties:
        error_code:
          type: string
        message:
          type: string
        trace_id:
          type: string
        details:
          type: object
    Pagination:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    Publication:
      type: object
      required: [publication_id, channel_id, title, status]
      properties:
        publication_id:
          type: string
        channel_id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, scheduled, publishing, published, failed, archived]
        asset_id:
          type: string
        thumbnail_asset_id:
          type: string
        platforms:
          type: array
          items:
            type: object
            properties:
              platform:
                type: string
              platform_publication_id:
                type: string
              status:
                type: string
              published_at:
                type: string
                format: date-time
              url:
                type: string
        scheduled_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
        seo_metadata:
          type: object
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PublicationCreate:
      type: object
      required: [channel_id, title, asset_id]
      properties:
        channel_id:
          type: string
        title:
          type: string
        description:
          type: string
        asset_id:
          type: string
        thumbnail_asset_id:
          type: string
        platforms:
          type: array
          items:
            type: string
        scheduled_at:
          type: string
          format: date-time
        seo_metadata:
          type: object
        tags:
          type: array
          items:
            type: string
    PublicationUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        platforms:
          type: array
          items:
            type: string
        scheduled_at:
          type: string
          format: date-time
        seo_metadata:
          type: object
        tags:
          type: array
          items:
            type: string
    PublishJob:
      type: object
      required: [job_id, publication_id, status]
      properties:
        job_id:
          type: string
        publication_id:
          type: string
        status:
          type: string
          enum: [queued, publishing, completed, failed, partial]
        platform_results:
          type: array
          items:
            type: object
            properties:
              platform:
                type: string
              status:
                type: string
              url:
                type: string
              error:
                type: string
    Platform:
      type: object
      required: [platform_id, name, status]
      properties:
        platform_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [connected, disconnected, error, pending_auth]
        capabilities:
          type: array
          items:
            type: string
        channel_id:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
