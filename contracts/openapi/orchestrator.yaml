openapi: 3.1.0
info:
  title: Orchestrator
  version: 1.0.0
  description: Durable workflow execution, DAG scheduling, state machines, sagas, budget locks
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: readinessCheck
      summary: Readiness check
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /workflows:
    post:
      operationId: startWorkflow
      summary: Start a new workflow
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowStartRequest"
      responses:
        "201":
          description: Workflow started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          description: Invalid workflow definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Budget exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listWorkflows
      summary: List workflows
      security:
        - bearerAuth: []
      parameters:
        - name: channel_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, QUEUED, STARTED, RUNNING, COMPLETED, PAUSED, FAILED, CANCELLED]
        - name: type
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Workflow list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workflow"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
  /workflows/{workflow_id}:
    get:
      operationId: getWorkflow
      summary: Get workflow state
      security:
        - bearerAuth: []
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Workflow details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteWorkflow
      summary: Delete a workflow
      security:
        - bearerAuth: []
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Workflow deleted
  /workflows/{workflow_id}/cancel:
    post:
      operationId: cancelWorkflow
      summary: Cancel a workflow
      security:
        - bearerAuth: []
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Workflow cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
  /workflows/{workflow_id}/pause:
    post:
      operationId: pauseWorkflow
      summary: Pause a workflow
      security:
        - bearerAuth: []
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Workflow paused
  /workflows/{workflow_id}/resume:
    post:
      operationId: resumeWorkflow
      summary: Resume a paused workflow
      security:
        - bearerAuth: []
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Workflow resumed
  /workflows/{workflow_id}/events:
    get:
      operationId: getWorkflowEvents
      summary: Get workflow event history
      security:
        - bearerAuth: []
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowEvent"
  /workflows/{workflow_id}/checkpoint:
    get:
      operationId: getWorkflowCheckpoint
      summary: Get workflow checkpoint data
      security:
        - bearerAuth: []
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Checkpoint data
          content:
            application/json:
              schema:
                type: object
  /dag/validate:
    post:
      operationId: validateDag
      summary: Validate a DAG definition
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DagDefinition"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, degraded]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [pass, fail, warn]
              latency_ms:
                type: number
    ErrorResponse:
      type: object
      required: [error_code, message, trace_id]
      properties:
        error_code:
          type: string
        message:
          type: string
        trace_id:
          type: string
        details:
          type: object
    Pagination:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    Workflow:
      type: object
      required: [workflow_id, type, status, channel_id]
      properties:
        workflow_id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
          enum: [PENDING, QUEUED, STARTED, RUNNING, COMPLETED, PAUSED, FAILED, CANCELLED, RECONCILING]
        priority:
          type: integer
          minimum: 1
          maximum: 10
        channel_id:
          type: string
        dag_definition:
          $ref: "#/components/schemas/DagDefinition"
        resource_allocation:
          type: object
          properties:
            cpu_cores:
              type: number
            memory_gb:
              type: number
            gpu_enabled:
              type: boolean
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        deadline:
          type: string
          format: date-time
        checkpoint_data:
          type: object
        error_log:
          type: object
          properties:
            error_code:
              type: string
            message:
              type: string
            timestamp:
              type: string
              format: date-time
            retry_count:
              type: integer
        budget_locked:
          type: boolean
        cost_accrued_usd:
          type: number
    WorkflowStartRequest:
      type: object
      required: [type, payload, channel_id]
      properties:
        type:
          type: string
        payload:
          type: object
        priority:
          type: integer
          default: 5
        channel_id:
          type: string
        deadline:
          type: string
          format: date-time
        dag_definition:
          $ref: "#/components/schemas/DagDefinition"
    DagDefinition:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, type]
            properties:
              id:
                type: string
              type:
                type: string
              config:
                type: object
              retries:
                type: integer
              timeout_seconds:
                type: integer
        edges:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from:
                type: string
              to:
                type: string
              condition:
                type: string
    WorkflowEvent:
      type: object
      required: [event_id, timestamp, type]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        type:
          type: string
        node_id:
          type: string
        status:
          type: string
        details:
          type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
