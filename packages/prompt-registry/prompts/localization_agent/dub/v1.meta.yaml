description: Video localization, translation, and dubbing prompt for the Localization Agent
author: SentraAura Engineering
version: v1
created_at: "2026-08-16"
updated_at: "2026-08-16"
tags: [localization, translation, dubbing, subtitles, i18n]
variables:
  - name: video_title
    type: string
    required: false
  - name: source_language
    type: string
    required: false
  - name: target_language
    type: string
    required: true
  - name: target_market
    type: string
    required: false
  - name: original_script
    type: string
    required: true
  - name: original_voiceover
    type: string
    required: false
  - name: cultural_notes
    type: string
    required: false
  - name: target_audience_profile
    type: string
    required: false
  - name: brand_glossary
    type: string
    required: false
output_format: json
