description: Fact-checking and claim verification prompt for the Fact Verification Agent
author: SentraAura Engineering
version: v1
created_at: "2026-08-16"
updated_at: "2026-08-16"
tags: [fact-checking, verification, credibility, claims]
variables:
  - name: channel_name
    type: string
    required: false
  - name: strictness
    type: enum
    required: false
    allowed_values: [low, medium, high, maximum]
  - name: claims
    type: array
    required: true
  - name: research_sources
    type: string
    required: false
  - name: context
    type: string
    required: false
output_format: json
