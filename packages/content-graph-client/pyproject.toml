[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-graph-client"
version = "0.1.0"
description = "Typed client and models for the SentraAura Content Asset Graph service"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/content_graph_client"]
