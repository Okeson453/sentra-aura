[tool.poetry]
name = "service-kit"
version = "0.1.0"
description = "Shared service kit for SentraAura FastAPI services"
authors = ["SentraAura Engineering <engineering@sentraaura.com>"]
packages = [{include = "service_kit", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109"
uvicorn = "^0.27"
httpx = "^0.26"
pydantic = "^2.5"
pydantic-settings = "^2.1"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
observability = {path = "../observability", develop = true}
sentinel-exceptions = {path = "../sentinel-exceptions", develop = true}
sentinel-security = {path = "../sentinel-security", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
