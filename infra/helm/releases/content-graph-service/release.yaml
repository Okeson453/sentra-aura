apiVersion: v1
kind: Namespace
metadata:
  name: sentra
  labels:
    name: sentra
    sentra.io/managed-by: helm
    sentra.io/part-of: sentra-aura
---
# ------------------------------------------------------------------------------
# SentraAura — Helm Release: content-graph-service
# Generated from generic sentra-service chart with service-specific overrides.
# ------------------------------------------------------------------------------
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: content-graph-service
  namespace: sentra
  labels:
    app.kubernetes.io/name: content-graph-service
    app.kubernetes.io/part-of: sentra-aura
    sentra.io/managed-by: flux
spec:
  interval: 5m
  chart:
    spec:
      chart: sentra-service
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: sentra-aura
        namespace: flux-system
  values:
    serviceName: content-graph-service
    namespace: sentra

    image:
      repository: ghcr.io/sentra-aura
      tag: "latest"

    replicaCount: 2

    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 256Mi

    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

    pdb:
      enabled: true
      minAvailable: 1

    networkPolicy:
      enabled: true
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  name: ingress-nginx
            - namespaceSelector:
                matchLabels:
                  name: observability
            - namespaceSelector:
                matchLabels:
                  name: sentra
      egress:
        - to:
            - namespaceSelector: {}
          ports:
            - protocol: TCP
              port: 443
            - protocol: TCP
              port: 80
            - protocol: TCP
              port: 5432
            - protocol: TCP
              port: 6379
            - protocol: TCP
              port: 4222
            - protocol: TCP
              port: 7233

    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/sentra-${ENVIRONMENT}-content-graph-service-role"

    env:
      - name: SERVICE_NAME
        value: "content-graph-service"
      - name: ENVIRONMENT
        value: "${ENVIRONMENT}"
      - name: LOG_LEVEL
        value: "info"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://otel-collector.observability.svc.cluster.local:4317"
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: "service.name=content-graph-service,deployment.environment=${ENVIRONMENT}"
      - name: NATS_URL
        value: "nats://nats.nats.svc.cluster.local:4222"
      - name: TEMPORAL_HOST
        value: "temporal-frontend.temporal.svc.cluster.local:7233"
      - name: DB_HOST
        valueFrom:
          secretKeyRef:
            name: sentra-db-credentials
            key: host
      - name: DB_PORT
        value: "5432"
      - name: REDIS_HOST
        valueFrom:
          secretKeyRef:
            name: sentra-redis-credentials
            key: host
      - name: REDIS_PORT
        value: "6379"

    extraLabels:
      sentra.io/service: content-graph-service
      sentra.io/tier: backend
