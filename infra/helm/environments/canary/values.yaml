# SentraAura — Canary Helm Values
# Overrides for the generic sentra-service chart per environment.

environment: canary

replicaCount: 2

image:
  pullPolicy: Always

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              name: observability
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 7233

env:
  - name: SERVICE_NAME
    value: "{{ .Values.serviceName }}"
  - name: ENVIRONMENT
    value: "canary"
  - name: LOG_LEVEL
    value: "debug"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.observability.svc.cluster.local:4317"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "service.name={{ .Values.serviceName }},deployment.environment=canary"
  - name: NATS_URL
    value: "nats://nats.nats.svc.cluster.local:4222"
  - name: TEMPORAL_HOST
    value: "temporal-frontend.temporal.svc.cluster.local:7233"
  - name: DB_HOST
    valueFrom:
      secretKeyRef:
        name: sentra-db-credentials
        key: host
  - name: DB_PORT
    value: "5432"
  - name: REDIS_HOST
    valueFrom:
      secretKeyRef:
        name: sentra-redis-credentials
        key: host
  - name: REDIS_PORT
    value: "6379"
