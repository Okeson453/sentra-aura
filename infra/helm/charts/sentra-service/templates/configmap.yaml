apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentra-service.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sentra-service.labels" . | nindent 4 }}
data:
  SERVICE_NAME: {{ .Values.serviceName | quote }}
  ENVIRONMENT: {{ .Values.environment | quote }}
