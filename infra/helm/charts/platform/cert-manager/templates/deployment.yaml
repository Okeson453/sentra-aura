apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: cert-manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["--v=2"]
