[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-graph-service"
version = "0.1.0"
description = "SentraAura Content Asset Graph Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "service-kit",
    "sentinel-exceptions",
]

[tool.hatch.build.targets.wheel]
packages = ["src/content_graph_service"]
