[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentra-aura-provider-gateway"
version = "1.0.0"
description = "SentraAura Provider Gateway — AI provider abstraction, routing, cost tracking, fallback chains"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-exporter-otlp>=1.23.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]
llm = [
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
    "cohere>=5.0.0",
    "mistralai>=0.1.0",
]
tts = [
    "elevenlabs>=0.3.0",
    "azure-cognitiveservices-speech>=1.35.0",
    "boto3>=1.34.0",
]
image = [
    "openai>=1.12.0",
]
all = [
    "sentra-aura-provider-gateway[llm,tts,image]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/provider_gateway"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
