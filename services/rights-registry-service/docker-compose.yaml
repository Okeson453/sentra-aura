version: "3.8"

services:
  rights_registry_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentra-aura-rights-registry-service
    ports:
      - "8080:8080"
    environment:
      - RIGHTS_REGISTRY_SERVICE_LOG_LEVEL=INFO
      - RIGHTS_REGISTRY_SERVICE_PORT=8080
      - RIGHTS_REGISTRY_SERVICE_DATABASE_URL=sqlite:///./rights_registry.db
      - RIGHTS_REGISTRY_SERVICE_REDIS_URL=redis://redis:6379/0
    volumes:
      - ./rights_registry.db:/app/rights_registry.db
    networks:
      - sentra-aura
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  sentra-aura:
    external: true
