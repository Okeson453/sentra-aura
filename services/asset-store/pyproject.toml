[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asset-store"
version = "0.1.0"
description = "SentraAura Asset Store — Uploads, provenance, lifecycle"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "service-kit",
    "sentinel-exceptions",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asset_store"]
