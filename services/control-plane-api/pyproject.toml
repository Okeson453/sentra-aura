[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "control-plane-api"
version = "0.1.0"
description = "SentraAura Control Plane API — Configure, Observe, Inspect, Override, Analyze"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "httpx>=0.27.0",
    "service-kit",
    "sentinel-exceptions",
    "sentinel-security",
    "agent-contracts",
    "content-graph-client",
    "provider-interfaces",
]

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane_api"]
