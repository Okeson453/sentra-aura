version: "3.8"

services:
  clipping_engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentra-aura-clipping-engine
    ports:
      - "8080:8080"
    environment:
      - CLIPPING_ENGINE_LOG_LEVEL=INFO
      - CLIPPING_ENGINE_PORT=8080
      - CLIPPING_ENGINE_DATABASE_URL=sqlite:///./clipping_engine.db
      - CLIPPING_ENGINE_REDIS_URL=redis://redis:6379/0
    volumes:
      - ./clipping_engine.db:/app/clipping_engine.db
    networks:
      - sentra-aura
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  sentra-aura:
    external: true
