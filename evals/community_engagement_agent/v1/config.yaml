# Evaluation configuration for community_engagement_agent
eval_version: v1
agent_id: community_engagement_agent
dataset_path: dataset.jsonl
benchmark_path: benchmark.json
metrics:
  - accuracy
  - relevance
  - safety
  - latency_ms
  - cost_usd
thresholds:
  min_accuracy: 0.80
  min_relevance: 0.75
  max_latency_ms: 5000
  max_cost_usd: 0.50
provider:
  gateway_url: http://provider-gateway:8000
  fallback_enabled: true
