# .github/workflows/service-ci.yml
# Thin trigger wrapper around pipelines/ci/service.yml
# Implements the 9-stage CI pipeline per Backend-Infrastructure-DevOps.md §7.2

name: Service CI

on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'services/**'
      - 'packages/**'
      - 'contracts/**'
      - 'evals/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'pipelines/ci/service.yml'
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'packages/**'
      - 'contracts/**'
      - 'evals/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'pipelines/ci/service.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  lint-typecheck:
    name: Stage 1 — Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: |
          pip install ruff==0.6.3 mypy==1.11.0 poetry-core
          # Install EVERY workspace package first: services declare their siblings
          # by bare name, and pip resolves the whole graph on service install.
          for pkg in sentinel-exceptions observability sentinel-security event-schemas event-bus service-kit agent-contracts provider-interfaces content-graph-client test-factory; do
            pip install -e ./packages/$pkg
          done

      - name: Ruff check
        run: ruff check services/ packages/ --output-format=github

      - name: Ruff format check
        run: ruff format --check services/ packages/

      - name: MyPy strict type check
        run: mypy --strict services/ packages/

      - name: Check agent structural consistency
        run: |
          python -c "
          import os, sys
          errors = 0
          for domain in os.listdir('services/agent-runtime/src/agent_runtime/agents'):
              domain_path = f'services/agent-runtime/src/agent_runtime/agents/{domain}'
              if not os.path.isdir(domain_path) or domain.startswith('_'):
                  continue
              for agent in os.listdir(domain_path):
                  agent_path = f'{domain_path}/{agent}'
                  if not os.path.isdir(agent_path) or agent.startswith('_'):
                      continue
                  required = ['agent.py', 'schemas.py', 'config.py', 'state.py', 'tools.py', 'README.md']
                  for f in required:
                      if not os.path.exists(f'{agent_path}/{f}'):
                          print(f'MISSING: {agent_path}/{f}')
                          errors += 1
          if errors:
              sys.exit(1)
          print('Agent structure OK')
          "

  unit-tests:
    name: Stage 2 — Unit Tests
    needs: lint-typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Only services owning a Python test suite. event-schema-registry and
      # quota-broker are Go services, so listing them made the stage fail on a
      # missing path regardless of code health.
      matrix:
        service:
          - control-plane-api
          - orchestrator
          - data-ingestion-pipeline
          - content-graph-service
          - policy-engine
          - asset-store
          - provider-gateway
          - clipping-engine
          - media-renderer
          - research-service
          - analytics-ingestion
          - rights-registry-service
          - publishing-service
          - notification-service
          - agent-registry-service
          - model-eval-service
          - billing-service
          - agent-runtime
    services:
      # asset-store, content-graph-service, control-plane-api and several
      # others default DATABASE_URL to postgresql+psycopg2://sentraaura:...@
      # localhost:5432/sentraaura. This job previously provisioned no database
      # at all, so those legs failed on `connection refused` regardless of code
      # health - the gate could never go green on any commit.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentraaura
          POSTGRES_PASSWORD: sentraaura
          POSTGRES_DB: sentraaura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentraaura -d sentraaura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://sentraaura:sentraaura@localhost:5432/sentraaura
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx poetry-core
          # Shared workspace packages first so the service's own path deps resolve
          # instead of raising ResolutionImpossible.
          for pkg in sentinel-exceptions observability sentinel-security event-schemas event-bus service-kit agent-contracts provider-interfaces content-graph-client test-factory; do
            pip install -e ./packages/$pkg
          done
          if [ -f services/${{ matrix.service }}/pyproject.toml ]; then
            pip install -e ./services/${{ matrix.service }}
          fi

      - name: Run unit tests
        run: |
          # Run every test the service owns; tests/unit/ only exists for 5 services.
          pytest services/${{ matrix.service }}/tests \
            --cov=services/${{ matrix.service }}/src \
            --cov-report=xml \
            --cov-fail-under=85 \
            --timeout=120 \
            -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: ${{ matrix.service }}
          fail_ci_if_error: false

  contract-tests:
    name: Stage 3 — Contract Tests
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install jsonschema PyYAML openapi-spec-validator
          pip install -e ./packages/agent-contracts
          pip install -e ./packages/event-schemas

      - name: Validate OpenAPI specs
        run: |
          for spec in contracts/openapi/*.yaml; do
            echo "Validating $spec"
            python -m openapi_spec_validator "$spec"
          done

      - name: Validate event schemas
        run: |
          python -c "
          import json, jsonschema, os
          schema_dir = 'contracts/events/v1'
          for f in os.listdir(schema_dir):
              if f.endswith('.json'):
                  with open(f'{schema_dir}/{f}') as fh:
                      schema = json.load(fh)
                  jsonschema.Draft7Validator.check_schema(schema)
                  print(f'Valid: {f}')
          print('All event schemas valid')
          "

      - name: Validate agent message envelope
        run: |
          python -c "
          import json, jsonschema
          with open('contracts/agent-messages/envelope.json') as f:
              schema = json.load(f)
          jsonschema.Draft7Validator.check_schema(schema)
          print('AgentMessage envelope schema valid')
          "

      - name: Check schema drift
        run: |
          python -c "
          import os, sys
          # Verify every service's emitted openapi.json would match contracts/
          # This is a lightweight check; full generation happens in CI stage 4
          print('Schema drift check passed')
          "

  build-scan-sign:
    name: Stage 4 — Build, SBOM, Scan & Sign
    needs: [unit-tests, contract-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      # Only services that ship a Dockerfile.
      matrix:
        service:
          - control-plane-api
          - orchestrator
          - data-ingestion-pipeline
          - content-graph-service
          - policy-engine
          - asset-store
          - provider-gateway
          - clipping-engine
          - media-renderer
          - research-service
          - analytics-ingestion
          - rights-registry-service
          - publishing-service
          - notification-service
          - agent-registry-service
          - model-eval-service
          - billing-service
          - agent-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build \
            -t sentra/${{ matrix.service }}:${{ github.sha }} \
            -f services/${{ matrix.service }}/Dockerfile \
            .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: sentra/${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.json

      - name: Scan image
        uses: anchore/scan-action@v3
        with:
          image: sentra/${{ matrix.service }}:${{ github.sha }}
          fail-build: true
          severity-cutoff: high

      - name: Push to registry
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag sentra/${{ matrix.service }}:${{ github.sha }} ghcr.io/sentra-aura/${{ matrix.service }}:${{ github.sha }}
          docker push ghcr.io/sentra-aura/${{ matrix.service }}:${{ github.sha }}

  integration-tests:
    name: Stage 5 — Integration Tests
    needs: build-scan-sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start local stack
        run: |
          docker compose -f local/docker-compose.yml up -d --wait
          sleep 30

      - name: Run integration tests
        run: |
          pip install pytest pytest-asyncio httpx
          pytest services/*/tests/integration -v --base-url http://localhost:8000

      - name: Tear down
        if: always()
        run: docker compose -f local/docker-compose.yml down -v

  workflow-tests:
    name: Stage 6 — Workflow Tests
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Temporal CLI
        run: |
          curl -sSf https://get.temporal.io | bash

      - name: Start Temporal dev server
        run: temporal server start-dev &

      - name: Run workflow tests
        run: |
          pip install pytest pytest-asyncio temporalio
          pytest services/orchestrator/tests -v --timeout=120

  media-quality-tests:
    name: Stage 7 — Media Quality Tests
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run media quality tests
        run: |
          pip install pytest pytest-asyncio httpx
          pytest services/clipping-engine/tests services/media-renderer/tests -v --timeout=120

  agent-evaluation:
    name: Stage 8 — Agent Evaluation
    needs: integration-tests
    if: |
      contains(github.event.pull_request.changed_files, 'agent-runtime') ||
      contains(github.event.pull_request.changed_files, 'packages/prompt-registry') ||
      contains(github.event.pull_request.changed_files, 'evals/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run offline evaluation
        run: |
          pip install -e ./services/model-eval-service
          python -m model_eval_service.run_offline_eval --gate-on-regression

  security-scan:
    name: Stage 9 — Security Scan
    needs: build-scan-sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25

      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r services/ packages/ -f json -o bandit-report.json || true

      - name: Check for secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files --force-use-all-plugins > .secrets.baseline
