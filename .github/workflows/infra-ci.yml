# .github/workflows/infra-ci.yml
# Thin trigger wrapper around pipelines/ci/infra.yml
# Implements the Terraform plan/apply pipeline per Backend-Infrastructure-DevOps.md §7.4

name: Infrastructure CI

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - 'infra/helm/**'
      - 'pipelines/ci/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - 'infra/helm/**'
      - 'pipelines/ci/infra.yml'

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform/

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: terraform-fmt
    strategy:
      fail-fast: false
      matrix:
        environment: [local, dev, staging, canary, production]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: terraform init
        run: |
          cd infra/terraform/environments/${{ matrix.environment }}
          terraform init -backend=false

      - name: terraform validate
        run: |
          cd infra/terraform/environments/${{ matrix.environment }}
          terraform validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    needs: terraform-fmt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.51.0

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --format compact infra/terraform/

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [terraform-validate, tflint]
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, production]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        run: |
          cd infra/terraform/environments/${{ matrix.environment }}
          terraform init

      - name: terraform plan
        run: |
          cd infra/terraform/environments/${{ matrix.environment }}
          terraform plan -no-color -out=tfplan

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`infra/terraform/environments/${{ matrix.environment }}/tfplan`, 'utf8');
            const output = `#### Terraform Plan \`${{ matrix.environment }}\`
            <details><summary>Show Plan</summary>
            \`\`\`hcl
            ${plan.substring(0, 65000)}
            \`\`\`
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [terraform-validate, tflint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: terraform-${{ matrix.environment }}
      url: ${{ steps.apply.outputs.url }}
    strategy:
      fail-fast: false
      matrix:
        environment: [dev]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        run: |
          cd infra/terraform/environments/${{ matrix.environment }}
          terraform init

      - name: terraform apply
        id: apply
        run: |
          cd infra/terraform/environments/${{ matrix.environment }}
          terraform apply -auto-approve

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    needs: terraform-fmt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.15.0'

      - name: Lint sentra-service chart
        run: |
          helm lint infra/helm/charts/sentra-service

      - name: Lint platform charts
        run: |
          for chart in infra/helm/charts/platform/*/; do
            helm lint "$chart"
          done

      - name: Template validation
        run: |
          helm template sentra-service infra/helm/charts/sentra-service \
            --values infra/helm/environments/dev/values.yaml \
            --set serviceName=test-service \
            --set imageTag=test

  kustomize-check:
    name: Kustomize Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kustomize
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.0/kustomize_v5.4.0_linux_amd64.tar.gz | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Validate release kustomizations
        run: |
          for release in infra/helm/releases/*/; do
            if [ -f "${release}kustomization.yaml" ]; then
              echo "Checking ${release}"
              kustomize build "${release}" > /dev/null
            fi
          done
